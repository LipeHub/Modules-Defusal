<!DOCTYPE html>
<html lang="en"> <!-- This will be changed by JS -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="keypad-page-title">Keypad Module - Defusal Assistant</title>
    <link rel="icon" type="image/png" href="../img/idefusal.png">
    <link rel="stylesheet" href="../css/style.css">
    <script>
        // This script runs instantly to prevent a theme flash.
        (function() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script>
        // This script runs instantly to set the language.
        (function() {
            const lang = localStorage.getItem('lang') || 'en';
            document.documentElement.setAttribute('lang', lang);
            document.querySelector('#lang-selector').value = lang;
        })();
    </script>  
</head>
<body>
    <div id="wiki-container">
        <header>
             <div id="header-controls">
                <button id="theme-toggle-btn" class="control-btn" data-key="theme-toggle">Theme</button>
                <div class="lang-selector">
                    <select id="lang-selector">
                        <option value="en">EN</option>
                        <option value="pt">PT-BR</option>
                    </select>
                </div>
            </div>
            <h1 data-key="keypad-page-title">Keypad Module</h1>
        </header>
        <nav id="wiki-nav">
            <ul>
                <li>
                    <!-- Removed the inline style attribute -->
                    <a href="https://defusal.fandom.com/wiki/Defusal_Wiki">
                        <img src="../img/fandom.png" data-key="Defusal">
                    </a>    
                </li>
                <li><a href="../index.html" data-key="home-nav">Home</a></li>
                <li><a href="mathematics.html" data-key="math-nav">Mathematics</a></li>
                <li><a href="timing.html" data-key="timing-nav">Timing</a></li>
                <li><a href="keypad.html" data-key="keypad-nav">Keypad</a></li>
                <li>
                    <!-- Removed the inline style attribute -->
                    <a href="https://www.roblox.com/games/3577061261/Defusal">
                        <img src="../img/game.png" data-key="Roblox">
                    </a>
                </li>
            </ul>
        </nav>
        <main id="main-content">
            <section class="content-section module-guide">
                <h2 data-key="how-to-solve">How to Solve the Module</h2>
                <p data-key="keypad-desc"></p>
                <p><strong data-key="steps-title"></strong></p>
                <ol>
                    <li data-key="keypad-step1"></li>
                    <li data-key="keypad-step2"></li>
                    <li data-key="keypad-step3"></li>
                    <li data-key="keypad-step4"></li>
                </ol>
                <p data-key="keypad-note"></p>
                <a href="keypad-calculator.html" class="tool-link-btn" data-key="open-calculator-btn"></a>
            </section>
        </main>
        <footer>
            <p data-key="footer-text">Defusal Game Wiki & Assistant is a fan-made site.</p>
        </footer>
    </div>
    <script src="../js/all.js"></script>
</body>
</html>
